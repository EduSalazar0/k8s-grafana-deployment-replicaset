# Service NodePort: expone la aplicación fuera del clúster y reparte el
# tráfico entre todos los Pods con la etiqueta app=webapp (2 a 5 según el HPA).
apiVersion: v1
kind: Service
metadata:
  name: webapp-svc
  namespace: webapp-gitops
  labels:
    app: webapp
    app.kubernetes.io/part-of: tarea-argocd
spec:
  type: NodePort
  selector:
    app: webapp             # Asocia el Service con los Pods del Deployment
  ports:
    - name: http
      protocol: TCP
      port: 80              # Puerto del Service dentro del clúster
      targetPort: http      # Puerto nombrado del contenedor (80)
      nodePort: 30080       # Puerto fijo en el nodo (rango 30000-32767)
