# ReplicaSet "solo" (sin Deployment), únicamente para comparar.
# Mantiene 2 Pods vivos igual que el del Deployment, pero si cambias la
# imagen aquí, los Pods existentes NO se actualizan: no hay RollingUpdate
# ni historial para hacer rollback. Por eso en la práctica se usa Deployment.
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: grafana-rs-demo
  namespace: grafana-lab
  labels:
    app: grafana-rs-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: grafana-rs-demo
  template:
    metadata:
      labels:
        app: grafana-rs-demo
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.6.0
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 384Mi
